
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Materiales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 6px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 28px;
            font-size: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 18px;
            transition: border-color 0.3s;
            outline: none;
            background: #fff;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #6764f6;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 2px solid #6764f6;
        }
        .material-group {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .material-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .material-row:last-child { margin-bottom: 0; }
        .material-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
            color: white;
        }
        .cobre .material-icon { background: #b87333; }
        .aluminio .material-icon { background: #a8a9ad; color: #333; }
        .hierro .material-icon { background: #434343; }
        .material-row label {
            margin: 0;
            min-width: 80px;
            font-size: 15px;
        }
        .material-row input {
            margin: 0;
            flex: 1;
            padding: 10px 14px;
        }
        .unit {
            font-size: 13px;
            color: #888;
            flex-shrink: 0;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6764f6, #ff000f);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 6px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(103,100,246,0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 11px;
        }
        .success-msg {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }
        .success-msg .check {
            font-size: 60px;
            margin-bottom: 10px;
        }
        .success-msg h2 { color: #27ae60; margin-bottom: 8px; font-size: 22px; }
        .success-msg p { color: #666; font-size: 15px; margin-bottom: 20px; }
        .success-msg button {
            background: #6764f6;
            font-size: 15px;
            padding: 12px;
            width: auto;
            padding-left: 30px;
            padding-right: 30px;
        }

        /* Registro local */
        .registro-section {
            margin-top: 30px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .registro-section h3 {
            font-size: 16px;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        .registro-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .registro-table th {
            background: #6764f6;
            color: white;
            padding: 8px 6px;
            text-align: left;
        }
        .registro-table td {
            padding: 6px;
            border-bottom: 1px solid #eee;
        }
        .registro-table tr:nth-child(even) { background: #f9f9f9; }
        .no-registros {
            text-align: center;
            color: #aaa;
            padding: 20px;
            font-size: 13px;
        }
        .btn-limpiar {
            background: #e74c3c;
            font-size: 13px;
            padding: 8px 16px;
            margin-top: 10px;
            width: auto;
        }
        .btn-exportar {
            background: #27ae60;
            font-size: 13px;
            padding: 8px 16px;
            margin-top: 10px;
            margin-right: 8px;
            width: auto;
        }
        .btns-registro {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="formSection">
            <h1>📋 Registro de Materiales</h1>
            <p class="subtitle">Completa los datos del registro</p>

            <form id="miFormulario" action="https://formspree.io/f/mkjnyjwb" method="POST">

                <!-- FECHA -->
                <label for="fecha">📅 Fecha</label>
                <select id="fecha" name="fecha" required>
                    <option value="" disabled selected>Selecciona una fecha</option>
                        <option value="10/09/2026">10/09/2026</option>
                        <option value="11/09/2026">11/09/2026</option>
                        <option value="12/09/2026">12/09/2026</option>
                        <option value="13/09/2026">13/09/2026</option>
                        <option value="14/09/2026">14/09/2026</option>
                        <option value="15/09/2026">15/09/2026</option>
                        <option value="16/09/2026">16/09/2026</option>
                        <option value="17/09/2026">17/09/2026</option>
                        <option value="18/09/2026">18/09/2026</option>
                        <option value="19/09/2026">19/09/2026</option>
                        <option value="20/09/2026">20/09/2026</option>
                        <option value="21/09/2026">21/09/2026</option>
                        <option value="22/09/2026">22/09/2026</option>
                        <option value="23/09/2026">23/09/2026</option>
                        <option value="24/09/2026">24/09/2026</option>
                        <option value="25/09/2026">25/09/2026</option>
                        <option value="26/09/2026">26/09/2026</option>
                        <option value="27/09/2026">27/09/2026</option>
                        <option value="28/09/2026">28/09/2026</option>
                        <option value="29/09/2026">29/09/2026</option>
                        <option value="30/09/2026">30/09/2026</option>
                        <option value="01/10/2026">01/10/2026</option>
                        <option value="02/10/2026">02/10/2026</option>
                        <option value="03/10/2026">03/10/2026</option>
                        <option value="04/10/2026">04/10/2026</option>
                        <option value="05/10/2026">05/10/2026</option>
                        <option value="06/10/2026">06/10/2026</option>
                        <option value="07/10/2026">07/10/2026</option>
                        <option value="08/10/2026">08/10/2026</option>
                        <option value="09/10/2026">09/10/2026</option>
                        <option value="10/10/2026">10/10/2026</option>
                        <option value="11/10/2026">11/10/2026</option>
                        <option value="12/10/2026">12/10/2026</option>
                        <option value="13/10/2026">13/10/2026</option>
                        <option value="14/10/2026">14/10/2026</option>
                        <option value="15/10/2026">15/10/2026</option>
                        <option value="16/10/2026">16/10/2026</option>
                        <option value="17/10/2026">17/10/2026</option>
                        <option value="18/10/2026">18/10/2026</option>
                        <option value="19/10/2026">19/10/2026</option>
                        <option value="20/10/2026">20/10/2026</option>
                        <option value="21/10/2026">21/10/2026</option>
                        <option value="22/10/2026">22/10/2026</option>
                        <option value="23/10/2026">23/10/2026</option>
                        <option value="24/10/2026">24/10/2026</option>
                        <option value="25/10/2026">25/10/2026</option>
                        <option value="26/10/2026">26/10/2026</option>
                        <option value="27/10/2026">27/10/2026</option>
                        <option value="28/10/2026">28/10/2026</option>
                        <option value="29/10/2026">29/10/2026</option>
                        <option value="30/10/2026">30/10/2026</option>
                        <option value="31/10/2026">31/10/2026</option>
                        <option value="01/11/2026">01/11/2026</option>
                        <option value="02/11/2026">02/11/2026</option>
                        <option value="03/11/2026">03/11/2026</option>
                        <option value="04/11/2026">04/11/2026</option>
                        <option value="05/11/2026">05/11/2026</option>
                        <option value="06/11/2026">06/11/2026</option>
                        <option value="07/11/2026">07/11/2026</option>
                        <option value="08/11/2026">08/11/2026</option>
                </select>

                <!-- MATERIALES -->
                <div class="material-group">
                    <div class="section-title">⚙️ Cantidad por Material</div>

                    <div class="material-row cobre">
                        <div class="material-icon">Cu</div>
                        <label for="cobre">Cobre</label>
                        <input type="number" id="cobre" name="cantidad_cobre" placeholder="0" min="0" step="any" value="">
                        <span class="unit">kg</span>
                    </div>

                    <div class="material-row aluminio">
                        <div class="material-icon">Al</div>
                        <label for="aluminio">Aluminio</label>
                        <input type="number" id="aluminio" name="cantidad_aluminio" placeholder="0" min="0" step="any" value="">
                        <span class="unit">kg</span>
                    </div>

                    <div class="material-row hierro">
                        <div class="material-icon">Fe</div>
                        <label for="hierro">Hierro</label>
                        <input type="number" id="hierro" name="cantidad_hierro" placeholder="0" min="0" step="any" value="">
                        <span class="unit">kg</span>
                    </div>
                </div>

                <!-- RESPONSABLE -->
                <label for="responsable">👤 Nombre del Responsable</label>
                <input type="text" id="responsable" name="responsable" placeholder="Nombre y apellido" required>

                <button type="submit">Guardar Registro</button>
            </form>
        </div>

        <!-- MENSAJE DE EXITO -->
        <div class="success-msg" id="successMsg">
            <div class="check">✅</div>
            <h2>Registro Guardado</h2>
            <p>Los datos fueron enviados correctamente.</p>
            <button onclick="nuevoRegistro()">Nuevo Registro</button>
        </div>

        <!-- HISTORIAL LOCAL -->
        <div class="registro-section">
            <h3>📊 Historial de Registros</h3>
            <div id="tablaContainer">
                <p class="no-registros" id="sinRegistros">No hay registros aun.</p>
            </div>
            <div class="btns-registro" id="botonesRegistro" style="display:none;">
                <button class="btn-exportar" onclick="exportarCSV()">📥 Exportar CSV</button>
                <button class="btn-limpiar" onclick="limpiarRegistros()">🗑️ Limpiar</button>
            </div>
        </div>

        <p class="footer">Registro de Materiales &copy; 2026</p>
    </div>

    <script>
        // Cargar registros del localStorage
        function getRegistros() {
            return JSON.parse(localStorage.getItem('registros') || '[]');
        }

        function saveRegistros(registros) {
            localStorage.setItem('registros', JSON.stringify(registros));
        }

        function renderTabla() {
            const registros = getRegistros();
            const container = document.getElementById('tablaContainer');
            const sinReg = document.getElementById('sinRegistros');
            const btns = document.getElementById('botonesRegistro');

            if (registros.length === 0) {
                container.innerHTML = '<p class="no-registros" id="sinRegistros">No hay registros aun.</p>';
                btns.style.display = 'none';
                return;
            }

            btns.style.display = 'flex';
            let html = '<table class="registro-table"><thead><tr>'
                + '<th>Fecha</th><th>Cobre</th><th>Aluminio</th><th>Hierro</th><th>Responsable</th>'
                + '</tr></thead><tbody>';

            registros.forEach(r => {
                html += '<tr>'
                    + '<td>' + r.fecha + '</td>'
                    + '<td>' + (r.cobre || 0) + '</td>'
                    + '<td>' + (r.aluminio || 0) + '</td>'
                    + '<td>' + (r.hierro || 0) + '</td>'
                    + '<td>' + r.responsable + '</td>'
                    + '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function limpiarRegistros() {
            if (confirm('¿Seguro que queres limpiar todos los registros?')) {
                localStorage.removeItem('registros');
                renderTabla();
            }
        }

        function exportarCSV() {
            const registros = getRegistros();
            if (registros.length === 0) return;
            let csv = 'Fecha,Cobre,Aluminio,Hierro,Responsable\n';
            registros.forEach(r => {
                csv += r.fecha + ',' + (r.cobre||0) + ',' + (r.aluminio||0) + ',' + (r.hierro||0) + ',' + r.responsable + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'registros_materiales.csv';
            a.click();
        }

        function nuevoRegistro() {
            document.getElementById('formSection').querySelector('form').reset();
            document.getElementById('formSection').querySelector('form').style.display = 'block';
            document.querySelector('h1').style.display = 'block';
            document.querySelector('.subtitle').style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }

        // Submit del formulario
        const form = document.getElementById('miFormulario');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            btn.textContent = 'Enviando...';
            btn.disabled = true;

            const registro = {
                fecha: document.getElementById('fecha').value,
                cobre: document.getElementById('cobre').value || 0,
                aluminio: document.getElementById('aluminio').value || 0,
                hierro: document.getElementById('hierro').value || 0,
                responsable: document.getElementById('responsable').value
            };

            // Guardar en localStorage
            const registros = getRegistros();
            registros.push(registro);
            saveRegistros(registros);

            // Enviar por Formspree (mail)
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    form.style.display = 'none';
                    document.querySelector('h1').style.display = 'none';
                    document.querySelector('.subtitle').style.display = 'none';
                    document.getElementById('successMsg').style.display = 'block';
                    renderTabla();
                } else {
                    // Igual se guardo local
                    alert('Se guardo localmente pero hubo un error al enviar por mail. Verifica tu ID de Formspree.');
                    renderTabla();
                    btn.textContent = 'Guardar Registro';
                    btn.disabled = false;
                }
            } catch (error) {
                alert('Se guardo localmente pero no se pudo enviar por mail. Revisa la conexion.');
                renderTabla();
                btn.textContent = 'Guardar Registro';
                btn.disabled = false;
            }
        });

        // Render inicial
        renderTabla();
    </script>
</body>
</html>
